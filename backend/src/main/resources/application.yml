spring:
  application:
    name: gamecollection
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 24h
  security:
    max-login-attempts: 5
    lock-duration: 15m
  cors:
    allowed-origins: http://localhost:5173